TripStatus:
  patch:
    summary: Cập nhật tiến trình chuyến đi
    tags: [Trip]
    security:
      - bearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schema_trip.yaml#/StatusUpdate'
    responses:
      '200':
        description: Cập nhật thành công
TripLocation:
  patch:
    summary: Đồng bộ GPS liên tục
    tags: [Trip]
    security:
      - bearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: './schema_trip.yaml#/LocationUpdate'
    responses:
      '200':
        description: Đã đồng bộ tọa độ
