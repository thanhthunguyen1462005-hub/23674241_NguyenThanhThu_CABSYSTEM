openapi: 3.0.3
info:
  title: CAB SYSTEM API
  version: 1.0.0
servers:
  - url: https://api.cabsystem.local/v1
paths:
  /auth/login:
    post:
      $ref: './paths_auth.yaml'
  /bookings:
    post:
      $ref: './paths_booking.yaml#/BookingRoot'
  /bookings/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      $ref: './paths_booking.yaml#/BookingCancel'
  /bookings/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      $ref: './paths_driver.yaml'
  /trips/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      $ref: './paths_trip.yaml#/TripStatus'
  /trips/{id}/location:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      $ref: './paths_trip.yaml#/TripLocation'
  /payments:
    post:
      $ref: './paths_payment.yaml'
  /admin/reports:
    get:
      $ref: './paths_admin.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
