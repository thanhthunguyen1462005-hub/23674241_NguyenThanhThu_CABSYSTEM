BookingRequest:
  type: object
  required: [pickup_latitude, destination_latitude, vehicle_type]
  properties:
    pickup_address:
      type: string
    pickup_latitude:
      type: number
    pickup_longitude:
      type: number
    destination_address:
      type: string
    destination_latitude:
      type: number
    destination_longitude:
      type: number
    vehicle_type:
      type: string
      enum: [4_SEATS, 7_SEATS, BIKE]
